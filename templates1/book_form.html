{% extends 'base.html' %}
{% block title %}Book Slot{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Book Your Slot</h1>
    <p class="page-subtitle">Fill in your details to confirm the booking</p>
</div>

<div class="form-container">
    <div class="booking-details-card">
        <h3 class="detail-heading">Slot Details</h3>
        <div class="detail-row">
            <span class="detail-label">📆 Date</span>
            <span class="detail-value">{{ slot.date_label }}</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">🕐 Time</span>
            <span class="detail-value">{{ slot.start_label }} → {{ slot.end_label }}</span>
        </div>
    </div>

    <form method="POST" action="{{ url_for('book', slot_id=slot.id) }}" class="booking-form" id="booking-form">
        <div class="form-group">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" id="name" name="name" class="form-input" placeholder="e.g. John Doe" required>
        </div>
        <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="e.g. john@example.com" required>
        </div>
        <div class="form-actions">
            <a href="{{ url_for('index') }}" class="btn btn-secondary">← Back</a>
            <button type="submit" class="btn btn-book" id="confirm-booking-btn">Confirm Booking</button>
        </div>
    </form>
</div>
{% endblock %}
