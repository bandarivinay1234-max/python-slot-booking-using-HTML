{% extends 'base.html' %}
{% block title %}Booking Confirmed{% endblock %}

{% block content %}
<div class="success-container">
    <div class="success-card">
        <div class="success-icon">✅</div>
        <h1 class="success-title">Booking Confirmed!</h1>
        <p class="success-subtitle">Your slot has been successfully booked, <strong>{{ name }}</strong>.</p>

        <div class="success-details">
            <div class="detail-row">
                <span class="detail-label">📆 Date</span>
                <span class="detail-value">{{ slot_date }}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">🕐 Time</span>
                <span class="detail-value">{{ start_time }} → {{ end_time }}</span>
            </div>
        </div>

        <div class="success-actions">
            <a href="{{ url_for('index') }}" class="btn btn-book">Browse More Slots</a>
            <a href="{{ url_for('booked') }}" class="btn btn-secondary">View My Bookings</a>
        </div>
    </div>
</div>
{% endblock %}
